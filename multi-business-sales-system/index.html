function viewModel(id){let m=by(db.models,id);openModal('معاينة موديل رقم '+m.no,`<div class="msg">${esc(buildMsg(m))}</div><div class="divider"></div><p><b>اليوم:</b> ${m.date}</p><p><b>العميل:</b> ${clientName(m.clientId)}</p><p><b>السعر:</b> ${money(m.price)}</p><p><b>الحالة:</b> ${m.status}</p><div class="actions"><button class="btn primary" onclick="copyText(buildMsg(by(db.models,'${id}')))">نسخ</button><button class="btn gold" onclick="closeModal();editModel('${id}')">تعديل</button></div>`)}
function editModel(id){let m=by(db.models,id);openModal('تعديل موديل',`<div class="row"><div class="c2"><label>رقم</label><input id="emNo" type="number" value="${m.no}"></div><div class="c3"><label>اليوم</label><select id="emDay">${dayOpts(m.dayId)}</select></div><div class="c3"><label>العميل</label><select id="emClient">${opts(db.clients,m.clientId)}</select></div><div class="c2"><label>الخدمة</label><select id="emService" onchange="let s=by(db.services,this.value); if(s) emPrice.value=s.price">${opts(db.services,m.serviceId)}</select></div><div class="c2"><label>السعر</label><input id="emPrice" type="number" step=".01" value="${m.price}"></div><div class="c2"><label>الحالة</label><select id="emStatus"><option value="created" ${m.status==='created'?'selected':''}>تم الإنشاء</option><option value="sent" ${m.status==='sent'?'selected':''}>تم الإرسال</option><option value="edit" ${m.status==='edit'?'selected':''}>يحتاج تعديل</option><option value="done" ${m.status==='done'?'selected':''}>تم التسليم</option></select></div><div class="c4"><label>مشروع</label><select id="emProject"><option value="">بدون</option>${db.projects.map(p=>`<option value="${p.id}" ${p.id===m.projectId?'selected':''}>${esc(p.title)}</option>`).join('')}</select></div><div class="c8"><label>ملاحظات</label><input id="emNotes" value="${esc(m.notes||'')}"></div>${Array.from({length:Math.max(4,m.positions.length)}).map((_,i)=>`<div class="c6"><label>الوضعية ${i+1}</label><input class="emPos" value="${esc(m.positions[i]?.url||'')}"></div>`).join('')}<div class="c12 actions"><button class="btn primary" onclick="saveModelEdit('${id}')">حفظ</button></div></div>`)} function saveModelEdit(id){let m=by(db.models,id), d=by(db.days,emDay.value);if(!canEditDay(m.dayId)||!canEditDay(d.id))return;m.no=Number(emNo.value);m.dayId=d.id;m.date=d.date;m.clientId=emClient.value;m.projectId=emProject.value;m.serviceId=emService.value;m.serviceName=serviceName(emService.value);m.price=Number(emPrice.value);m.status=emStatus.value;m.notes=emNotes.value;m.positions=qa('.emPos').map((x,i)=>({name:'الوضعية '+(i+1),url:x.value.trim()})).filter(p=>p.url);closeModal();save()} function delModel(id){let m=by(db.models,id);if(!canEditDay(m.dayId))return;if(confirm('حذف الموديل؟')){db.models=db.models.filter(m=>m.id!==id);save()}}
function renderWork(){let d=activeDay();work.innerHTML=`<div class="card"><h3>تسجيل شغل</h3><div class="row"><div class="c3"><label>اليوم</label><select id="opDay">${dayOpts(d.id)}</select></div><div class="c3"><label>العميل</label><select id="opClient">${opts(db.clients)}</select></div><div class="c3"><label>الخدمة</label><select id="opService" onchange="let s=by(db.services,this.value);opPrice.value=s?s.price:0;calcOp()">${opts(db.services)}</select></div><div class="c1"><label>السعر</label><input id="opPrice" type="number" step=".01" oninput="calcOp()"></div><div class="c1"><label>العدد</label><input id="opQty" type="number" value="1" oninput="calcOp()"></div><div class="c1"><label>الإجمالي</label><input id="opTotal" readonly></div><div class="c12"><label>ملاحظات</label><input id="opNote"></div><div class="c12 actions"><button class="btn primary" onclick="addOp()">حفظ العملية</button></div></div></div><div class="card"><h3>سجل الشغل</h3><div class="table"><table><thead><tr><th>اليوم</th><th>العميل</th><th>الخدمة</th><th>العدد</th><th>السعر</th><th>الإجمالي</th><th>ملاحظة</th><th>تحكم</th></tr></thead><tbody>${db.operations.filter(o=>isVisibleRecord(o)).slice().sort((a,b)=>b.date.localeCompare(a.date)).map(o=>`<tr><td>${o.date}</td><td>${clientName(o.clientId)}</td><td>${serviceName(o.serviceId)}</td><td>${o.qty}</td><td>${money(o.price)}</td><td>${money(o.total)}</td><td>${esc(o.note||'')}</td><td class="actions"><button class="btn" onclick="viewOp('${o.id}')">معاينة</button><button class="btn gold" onclick="editOp('${o.id}')">تعديل</button><button class="btn red" onclick="delOp('${o.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="8">لا يوجد عمليات</td></tr>'}</tbody></table></div></div>`;setTimeout(()=>{let s=by(db.services,opService.value);opPrice.value=s?s.price:0;calcOp()},0)} function calcOp(){opTotal.value=Number(opPrice.value||0)*Number(opQty.value||0)} function addOp(){let d=by(db.days,opDay.value), s=by(db.services,opService.value);if(!s)return alert('اختار الخدمة');if(!canEditDay(d.id))return;db.operations.push({id:uid(),dayId:d.id,date:d.date,clientId:opClient.value,serviceId:s.id,serviceName:s.name,price:Number(opPrice.value||s.price||0),qty:Number(opQty.value||0),total:Number(opPrice.value||s.price||0)*Number(opQty.value||0),note:opNote.value});save()} function viewOp(id){let o=by(db.operations,id);openModal('معاينة عملية',`<p>${o.date} - ${clientName(o.clientId)}</p><p>${serviceName(o.serviceId)} × ${o.qty} = <b>${money(o.total)}</b></p><p>${esc(o.note||'')}</p>`)} function editOp(id){let o=by(db.operations,id);openModal('تعديل عملية',`<div class="row"><div class="c3"><label>اليوم</label><select id="eoDay">${dayOpts(o.dayId)}</select></div><div class="c3"><label>العميل</label><select id="eoClient">${opts(db.clients,o.clientId)}</select></div><div class="c3"><label>الخدمة</label><select id="eoService" onchange="let s=by(db.services,this.value); if(s) eoPrice.value=s.price; eoTotal.value=Number(eoPrice.value||0)*Number(eoQty.value||0)">${opts(db.services,o.serviceId)}</select></div><div class="c1"><label>السعر</label><input id="eoPrice" type="number" step=".01" value="${o.price}" oninput="eoTotal.value=Number(eoPrice.value||0)*Number(eoQty.value||0)"></div><div class="c1"><label>العدد</label><input id="eoQty" type="number" value="${o.qty}" oninput="eoTotal.value=Number(eoPrice.value||0)*Number(eoQty.value||0)"></div><div class="c1"><label>الإجمالي</label><input id="eoTotal" readonly value="${o.total}"></div><div class="c12"><label>ملاحظة</label><input id="eoNote" value="${esc(o.note||'')}"></div><div class="c12 actions"><button class="btn primary" onclick="saveOpEdit('${id}')">حفظ</button></div></div>`)} function saveOpEdit(id){let o=by(db.operations,id),d=by(db.days,eoDay.value);if(!canEditDay(o.dayId)||!canEditDay(d.id))return;o.dayId=d.id;o.date=d.date;o.clientId=eoClient.value;o.serviceId=eoService.value;o.serviceName=serviceName(eoService.value);o.price=Number(eoPrice.value);o.qty=Number(eoQty.value);o.total=o.price*o.qty;o.note=eoNote.value;closeModal();save()} function delOp(id){let o=by(db.operations,id);if(!canEditDay(o.dayId))return;if(confirm('حذف العملية؟')){db.operations=db.operations.filter(o=>o.id!==id);save()}}
function renderDays(){days.innerHTML=`<div class="card"><h3>الأيام وتقفيل اليوم</h3><p>اليوم الحالي: <b>${activeDay().date}</b></p><p class='muted'>الأيام المقفولة محفوظة لكنها مخفية من السجلات والتقارير النشطة، ولا تظهر مرة أخرى إلا عند فتح اليوم.</p><div class="actions"><input id="newDay" type="date" value="${today()}" style="width:170px"><button class="btn primary" onclick="openOrCreateDay(newDay.value)">فتح/إنشاء يوم</button><button class="btn red" onclick="closeDay()">تقفيل اليوم وفتح التالي</button></div></div><div class="card"><div class="table"><table><thead><tr><th>اليوم</th><th>الحالة</th><th>موديلات</th><th>عمليات</th><th>الإجمالي</th><th>تحكم</th></tr></thead><tbody>${db.days.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(d=>{let t=totals(x=>x.dayId===d.id);return `<tr><td>${d.date}</td><td><span class="badge ${d.status==='closed'?'closed':'ok'}">${d.status==='closed'?'مقفل':'مفتوح'}</span></td><td>${t.mods}</td><td>${t.ops}</td><td>${money(t.work)}</td><td class="actions"><button class="btn" onclick="openOrCreateDay('${d.date}')">فتح</button><button class="btn gold" onclick="editDay('${d.id}')">تعديل التاريخ</button><button class="btn blue" onclick="reportForDay('${d.id}')">تقرير</button><button class="btn red" onclick="deleteDay('${d.id}')">حذف</button></td></tr>`}).join('')}</tbody></table></div></div>`} function openOrCreateDay(dt){let d=db.days.find(x=>x.date===dt);if(!d){d={id:uid(),date:dt,status:'open',note:''};db.days.push(d)}d.status='open';db.activeDayId=d.id;save();page('workday')} function closeDay(){let d=activeDay();if(d.status==='closed')return alert('اليوم مقفل بالفعل');d.status='closed';d.closedAt=new Date().toISOString();d.snapshot={models:db.models.filter(m=>m.dayId===d.id).length,operations:db.operations.filter(o=>o.dayId===d.id).length,total:totals(x=>x.dayId===d.id).work};let nd=addDays(d.date,1);let n=db.days.find(x=>x.date===nd)||{id:uid(),date:nd,status:'open',note:''};if(!db.days.includes(n))db.days.push(n);db.activeDayId=n.id;save();alert('تم تقفيل اليوم. بياناته اختفت من السجلات النشطة، وتقدر ترجعها فقط من زر فتح اليوم في صفحة الأيام.')} function editDay(id){let d=by(db.days,id);if(!canEditDay(id))return;let nd=prompt('اكتب التاريخ الجديد',d.date);if(!nd)return;d.date=nd;[...db.models,...db.operations,...db.payments].filter(x=>x.dayId===id).forEach(x=>x.date=nd);save()} function deleteDay(id){if(isDayClosed(id))return alert('لا يمكن حذف يوم مؤكد');if(id===db.activeDayId)return alert('افتح يوم تاني الأول');if(confirm('حذف اليوم فقط؟ الشغل هيفضل بدون يوم، الأفضل تنقله قبل الحذف.')){db.days=db.days.filter(d=>d.id!==id);save()}} function reportForDay(id){page('reports');setTimeout(()=>{rType.value='day';rDay.value=id;drawReport()},50)}
function renderReports(){reports.innerHTML=`<div class="card noPrint"><h3>التقارير</h3><div class="row"><div class="c3"><label>نوع التقرير</label><select id="rType"><option value="day">يومي</option><option value="week">أسبوعي من اليوم الحالي</option><option value="range">من تاريخ لتاريخ</option></select></div><div class="c3"><label>اليوم</label><select id="rDay">${dayOpts(activeDay().id)}</select></div><div class="c2"><label>من</label><input id="rFrom" type="date" value="${activeDay().date}"></div><div class="c2"><label>إلى</label><input id="rTo" type="date" value="${activeDay().date}"></div><div class="c2"><label>العميل</label><select id="rClient"><option value="">كل العملاء</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="c12 actions"><button class="btn primary" onclick="drawReport()">عرض التقرير</button><button class="btn gold" onclick="printReport()">طباعة / PDF</button><button class="btn" onclick="copyText(reportText())">نسخ واتساب</button></div></div></div><div class="card"><div id="reportOut" class="printArea"><p class="muted">اختار التقرير واضغط عرض.</p></div></div>`}
function getReportItems(){let from,to;if(rType.value==='day'){let d=by(db.days,rDay.value);from=to=d.date}else if(rType.value==='week'){let d=new Date(activeDay().date+'T00:00:00'),day=d.getDay(),diff=(day+1)%7;d.setDate(d.getDate()-diff);from=d.toISOString().slice(0,10);to=activeDay().date}else{from=rFrom.value;to=rTo.value}let cid=rClient.value;let filt=x=>isVisibleRecord(x)&&x.date>=from&&x.date<=to&&(!cid||x.clientId===cid);return{from,to,cid,models:db.models.filter(filt),ops:db.operations.filter(filt),pays:db.payments.filter(filt)}} function drawReport(){let R=getReportItems(), dates=[...new Set([...R.models.map(x=>x.date),...R.ops.map(x=>x.date),...R.pays.map(x=>x.date)])].sort();let t={work:R.models.reduce((s,m)=>s+Number(m.price||0),0)+R.ops.reduce((s,o)=>s+Number(o.total||0),0),paid:R.pays.filter(p=>p.type==='payment').reduce((s,p)=>s+Number(p.amount||0),0),adv:R.pays.filter(p=>p.type==='advance').reduce((s,p)=>s+Number(p.amount||0),0)};reportOut.innerHTML=`<div class="reportHead"><div><h2>تقرير أعمال</h2><p>الفترة: ${R.from} إلى ${R.to}</p></div><img src="assets/logo.jpeg"></div>${dates.map(dt=>{let ms=R.models.filter(m=>m.date===dt),ops=R.ops.filter(o=>o.date===dt),pays=R.pays.filter(p=>p.date===dt);let sub=ms.reduce((s,m)=>s+Number(m.price||0),0)+ops.reduce((s,o)=>s+Number(o.total||0),0);return `<h3>${dt}</h3><div class="table"><table><thead><tr><th>النوع</th><th>العميل</th><th>التفاصيل</th><th>العدد</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>${ms.map(m=>`<tr><td>موديل</td><td>${clientName(m.clientId)}</td><td>موديل رقم ${m.no} - ${m.positions.length} وضعيات</td><td>1</td><td>${money(m.price)}</td><td>${money(m.price)}</td></tr>`).join('')}${ops.map(o=>`<tr><td>خدمة</td><td>${clientName(o.clientId)}</td><td>${serviceName(o.serviceId)}</td><td>${o.qty}</td><td>${money(o.price)}</td><td>${money(o.total)}</td></tr>`).join('')}${pays.map(p=>`<tr><td>${p.type==='payment'?'دفعة':'سلفة/خصم'}</td><td>${clientName(p.clientId)}</td><td>${esc(p.note||'')}</td><td>-</td><td>-</td><td>${money(p.amount)}</td></tr>`).join('')}</tbody></table></div><p><b>إجمالي اليوم:</b> ${money(sub)}</p>`}).join('')||'<p>لا يوجد بيانات</p>'}<div class="divider"></div><h3>الإجمالي</h3><p>إجمالي الشغل: <b>${money(t.work)}</b></p><p>المدفوع: <b>${money(t.paid)}</b> - السلف/الخصم: <b>${money(t.adv)}</b></p><p>الباقي: <b>${money(t.work-t.paid-t.adv)}</b></p>`} function printReport(){reports.classList.add('printing');window.print()} function reportText(){let R=getReportItems();return `تقرير أعمال من ${R.from} إلى ${R.to}\nإجمالي الشغل: ${money(R.models.reduce((s,m)=>s+Number(m.price||0),0)+R.ops.reduce((s,o)=>s+Number(o.total||0),0))}\nعدد الموديلات: ${R.models.length}\nعدد العمليات: ${R.ops.length}`}
function renderAnalytics(){let rows=db.days.filter(d=>d.status!=='closed').map(d=>{let t=totals(x=>x.dayId===d.id);return{date:d.date,total:t.work,mods:t.mods,ops:t.ops}}).filter(x=>x.total||x.mods||x.ops).sort((a,b)=>a.date.localeCompare(b.date));let max=rows.length?rows.reduce((a,b)=>a.total>b.total?a:b):null,min=rows.length?rows.reduce((a,b)=>a.total<b.total?a:b):null,avg=rows.length?rows.reduce((s,x)=>s+x.total,0)/rows.length:0;analytics.innerHTML=`<div class="grid"><div class="card stat"><b>أعلى يوم</b><span>${max?money(max.total):'0 ج'}</span><small>${max?.date||'-'}</small></div><div class="card stat"><b>أقل يوم</b><span>${min?money(min.total):'0 ج'}</span><small>${min?.date||'-'}</small></div><div class="card stat"><b>متوسط اليوم</b><span>${money(avg)}</span></div><div class="card stat"><b>أيام الشغل</b><span>${rows.length}</span></div></div><div class="card"><h3>تحليل الأيام</h3>${rows.map(r=>`<div style="margin:12px 0"><b>${r.date}</b> <span class="muted">${r.mods} موديل - ${r.ops} عملية - ${money(r.total)}</span><div class="progress"><span style="width:${max?Math.min(100,r.total/max.total*100):0}%"></span></div></div>`).join('')||'<p class="muted">لا توجد بيانات</p>'}</div>`}
function renderClients(){clients.innerHTML=`<div class="card"><h3>العملاء</h3><div class="row"><div class="c4"><label>اسم العميل</label><input id="cName"></div><div class="c4"><label>رقم واتساب</label><input id="cPhone" placeholder="201xxxxxxxxx"></div><div class="c4"><label>ملاحظات</label><input id="cNote"></div><div class="c12 actions"><button class="btn primary" onclick="addClient()">إضافة</button></div></div></div><div class="card"><div class="table"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>ملاحظات</th><th>حساب</th><th>تحكم</th></tr></thead><tbody>${db.clients.map(c=>{let t=totals(x=>x.clientId===c.id && isVisibleRecord(x));return `<tr><td>${esc(c.name)}</td><td>${esc(c.phone||'')}</td><td>${esc(c.note||'')}</td><td>${money(t.balance)}</td><td class="actions"><button class="btn" onclick="clientReport('${c.id}')">تقرير</button><button class="btn gold" onclick="editClient('${c.id}')">تعديل</button><button class="btn red" onclick="delClient('${c.id}')">حذف</button></td></tr>`}).join('')||'<tr><td colspan="5">لا يوجد عملاء</td></tr>'}</tbody></table></div></div>`} function addClient(){if(!cName.value.trim())return;db.clients.push({id:uid(),name:cName.value.trim(),phone:cPhone.value.trim(),note:cNote.value.trim()});save()} function editClient(id){let c=by(db.clients,id);openModal('تعديل عميل',`<label>الاسم</label><input id="ecName" value="${esc(c.name)}"><label>الهاتف</label><input id="ecPhone" value="${esc(c.phone||'')}"><label>ملاحظة</label><input id="ecNote" value="${esc(c.note||'')}"><button class="btn primary" onclick="let c=by(db.clients,'${id}');c.name=ecName.value;c.phone=ecPhone.value;c.note=ecNote.value;closeModal();save()">حفظ</button>`)} function delClient(id){if(confirm('حذف العميل؟')){db.clients=db.clients.filter(c=>c.id!==id);save()}} function clientReport(id){page('reports');setTimeout(()=>{rClient.value=id;drawReport()},50)}
function renderServices(){services.innerHTML=`<div class="card"><h3>الخدمات والأسعار</h3><div class="row"><div class="c6"><label>الخدمة</label><input id="sName"></div><div class="c3"><label>السعر</label><input id="sPrice" type="number" step=".01"></div><div class="c3 actions" style="align-items:end"><button class="btn primary" onclick="addService()">إضافة</button></div></div></div><div class="card"><div class="table"><table><thead><tr><th>الخدمة</th><th>السعر</th><th>تحكم</th></tr></thead><tbody>${db.services.map(s=>`<tr><td>${esc(s.name)}</td><td>${money(s.price)}</td><td class="actions"><button class="btn gold" onclick="editService('${s.id}')">تعديل</button><button class="btn red" onclick="delService('${s.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="3">لا يوجد خدمات</td></tr>'}</tbody></table></div></div>`} function addService(){if(!sName.value.trim())return;db.services.push({id:uid(),name:sName.value.trim(),price:Number(sPrice.value||0)});save()} function editService(id){let s=by(db.services,id);openModal('تعديل خدمة',`<label>الخدمة</label><input id="esName" value="${esc(s.name)}"><label>السعر</label><input id="esPrice" type="number" step=".01" value="${s.price}"><button class="btn primary" onclick="let s=by(db.services,'${id}');s.name=esName.value;s.price=Number(esPrice.value);closeModal();save()">حفظ</button>`)} function delService(id){if(confirm('حذف الخدمة؟')){db.services=db.services.filter(s=>s.id!==id);save()}}
function renderPayments(){payments.innerHTML=`<div class="card"><h3>المدفوعات والسلف</h3><div class="row"><div class="c3"><label>اليوم</label><select id="pDay">${dayOpts(activeDay().id)}</select></div><div class="c3"><label>العميل</label><select id="pClient">${opts(db.clients)}</select></div><div class="c2"><label>النوع</label><select id="pType"><option value="payment">دفعة</option><option value="advance">سلفة/خصم</option></select></div><div class="c2"><label>المبلغ</label><input id="pAmount" type="number" step=".01"></div><div class="c2"><label>ملاحظة</label><input id="pNote"></div><div class="c12 actions"><button class="btn primary" onclick="addPayment()">حفظ</button></div></div></div><div class="card"><div class="table"><table><thead><tr><th>اليوم</th><th>العميل</th><th>النوع</th><th>المبلغ</th><th>ملاحظة</th><th>تحكم</th></tr></thead><tbody>${db.payments.filter(p=>isVisibleRecord(p)).slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<tr><td>${p.date}</td><td>${clientName(p.clientId)}</td><td>${p.type==='payment'?'دفعة':'سلفة/خصم'}</td><td>${money(p.amount)}</td><td>${esc(p.note||'')}</td><td class="actions"><button class="btn gold" onclick="editPayment('${p.id}')">تعديل</button><button class="btn red" onclick="delPayment('${p.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="6">لا يوجد</td></tr>'}</tbody></table></div></div>`} function addPayment(){let d=by(db.days,pDay.value);if(!canEditDay(d.id))return;db.payments.push({id:uid(),dayId:d.id,date:d.date,clientId:pClient.value,type:pType.value,amount:Number(pAmount.value||0),note:pNote.value});save()} function editPayment(id){let p=by(db.payments,id);openModal('تعديل حركة مالية',`<div class="row"><div class="c3"><label>اليوم</label><select id="epDay">${dayOpts(p.dayId)}</select></div><div class="c3"><label>العميل</label><select id="epClient">${opts(db.clients,p.clientId)}</select></div><div class="c2"><label>النوع</label><select id="epType"><option value="payment" ${p.type==='payment'?'selected':''}>دفعة</option><option value="advance" ${p.type==='advance'?'selected':''}>سلفة/خصم</option></select></div><div class="c2"><label>المبلغ</label><input id="epAmount" type="number" step=".01" value="${p.amount}"></div><div class="c12"><label>ملاحظة</label><input id="epNote" value="${esc(p.note||'')}"></div><div class="c12"><button class="btn primary" onclick="savePayEdit('${id}')">حفظ</button></div></div>`)} function savePayEdit(id){let p=by(db.payments,id),d=by(db.days,epDay.value);if(!canEditDay(p.dayId)||!canEditDay(d.id))return;p.dayId=d.id;p.date=d.date;p.clientId=epClient.value;p.type=epType.value;p.amount=Number(epAmount.value);p.note=epNote.value;closeModal();save()} function delPayment(id){let p=by(db.payments,id);if(!canEditDay(p.dayId))return;if(confirm('حذف الحركة؟')){db.payments=db.payments.filter(p=>p.id!==id);save()}}
function renderArchive(){archive.innerHTML=`<div class="card"><h3>الأرشيف وقفل الأسبوع</h3><div class="row"><div class="c3"><label>العميل</label><select id="stClient">${opts(db.clients)}</select></div><div class="c3"><label>من</label><input id="stFrom" type="date" value="${activeDay().date}"></div><div class="c3"><label>إلى</label><input id="stTo" type="date" value="${activeDay().date}"></div><div class="c3"><label>ملاحظة</label><input id="stNote"></div><div class="c12 actions"><button class="btn primary" onclick="createSettlement()">قفل أسبوع / تسوية</button></div></div></div><div class="card"><div class="table"><table><thead><tr><th>رقم</th><th>العميل</th><th>الفترة</th><th>الإجمالي</th><th>المدفوع</th><th>الباقي</th><th>تحكم</th></tr></thead><tbody>${db.settlements.map((s,i)=>`<tr><td>${i+1}</td><td>${clientName(s.clientId)}</td><td>${s.from} → ${s.to}</td><td>${money(s.work)}</td><td>${money(s.paid+s.adv)}</td><td>${money(s.balance)}</td><td class="actions"><button class="btn" onclick="viewSettlement('${s.id}')">معاينة</button><button class="btn red" onclick="delSettlement('${s.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="7">لا يوجد تسويات</td></tr>'}</tbody></table></div></div>`} function createSettlement(){let cid=stClient.value,from=stFrom.value,to=stTo.value;if(!cid)return alert('اختار العميل');let f=x=>x.clientId===cid&&x.date>=from&&x.date<=to,t=totals(f);db.settlements.push({id:uid(),clientId:cid,from,to,work:t.work,paid:t.paid,adv:t.adv,balance:t.balance,note:stNote.value,createdAt:new Date().toISOString()});save()} function viewSettlement(id){let s=by(db.settlements,id);openModal('تسوية أسبوع',`<p>${clientName(s.clientId)}</p><p>${s.from} إلى ${s.to}</p><p>إجمالي: ${money(s.work)}</p><p>مدفوع وسلف: ${money(s.paid+s.adv)}</p><p>الباقي: ${money(s.balance)}</p><p>${esc(s.note||'')}</p>`)} function delSettlement(id){if(confirm('حذف التسوية؟')){db.settlements=db.settlements.filter(s=>s.id!==id);save()}}
function renderSettings(){settings.innerHTML=`<div class="card"><h3>الإعدادات والنسخ الاحتياطي</h3><div class="row"><div class="c4"><label>اسم البراند</label><input id="setBrand" value="${esc(db.settings.brand)}"></div><div class="c12 actions"><button class="btn primary" onclick="db.settings.brand=setBrand.value;delete db.settings.defaultPrice;save()">حفظ الإعدادات</button><button class="btn gold" onclick="downloadBackup()">تحميل Backup</button><input type="file" id="imp" accept="application/json" onchange="importBackup(this.files[0])"><button class="btn blue" onclick="exportCSV()">تصدير CSV</button><button class="btn green" onclick="db=migrateDB(PRELOADED_DB);save();alert('تم تحميل البيانات الكاملة المصححة')">تحميل البيانات الكاملة المصححة</button><button class="btn red" onclick="resetAll()">تصفير البرنامج</button></div></div></div><div class="card"><p class="muted">لا يوجد أي سعر افتراضي عام. أي سعر في التسجيل أو الموديل يتم أخذه من الخدمة المختارة فقط أو يتم إدخاله يدويًا. البرنامج يحفظ Offline على نفس المتصفح.</p></div>`} function downloadBackup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='youssef-backup-'+today()+'.json';a.click()} function importBackup(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let parsed=JSON.parse(r.result);db=(parsed&&parsed.entries&&parsed.models)?buildLegacyBackup(parsed):migrateDB(parsed);rawSave();renderAll();alert('تم الاستيراد مع الترقية والتصحيح')}catch(e){alert('ملف غير صحيح')}};r.readAsText(file)} function exportCSV(){let rows=[['type','date','client','details','qty','price','total']];db.models.forEach(m=>rows.push(['model',m.date,clientName(m.clientId),'model '+m.no,1,m.price,m.price]));db.operations.forEach(o=>rows.push(['operation',o.date,clientName(o.clientId),serviceName(o.serviceId),o.qty,o.price,o.total]));let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='youssef-export.csv';a.click()} function resetAll(){if(confirm('تصفير كل البيانات نهائيًا؟')){localStorage.removeItem(KEY);db=init();save()}}
renderAll();page('dashboard');
</script></body></html>
